# Почтовый сервис для тестового задания.
# Свои службы дописывайте в этот же файл.
# Обязательные имена служб: worker и exporter.

services:
  provider:
    # Образ скачивается сам при первом запуске, собирать его не нужно.
    image: ${PROVIDER_IMAGE:-gitea.teamlead.one/armanteam_public/mail-provider:1}
    environment:
      CANDIDATE: ${CANDIDATE:?укажите CANDIDATE в файле .env}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/v1/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      provider:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PROVIDER_URL: http://provider:8080

  exporter:
    build: .
    command: ["node", "dist/exporter.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    volumes:
      - ./out:/app/out

volumes:
  db-data:
